name: user docs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - carrot-wip
  workflow_dispatch:

jobs:
  check_user_docs:
    name: check mapped user docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install documentation test dependency
        run: python -m pip install pytest
      # AutoSync merges already-committed upstream changes; do not require separate
      # driver-monitoring docs on a mirrored merge. Keep checks for direct edits/PRs.
      - name: Check code and user documentation changes
        if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge official carrot-wip ') }}
        env:
          DOCS_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DOCS_EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--base "$DOCS_BASE_SHA")
          if [ "$DOCS_EVENT_NAME" = "push" ]; then
            args+=(--commit-overrides)
          fi
          python tools/docs/check_user_docs.py "${args[@]}"
      - name: Test user documentation checker
        if: ${{ !cancelled() }}
        run: python -m pytest -q -o addopts='' --confcutdir=tools/docs/tests tools/docs/tests/test_check_user_docs.py
